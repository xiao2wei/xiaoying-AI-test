[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xiaoying-policy-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["requests>=2.32,<3", "numpy>=2,<3", "fastembed==0.9.1", "rank-bm25==0.2.2", "pdfplumber>=0.11,<0.12"]

[project.scripts]
policy-agent = "policy_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
